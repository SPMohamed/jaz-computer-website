<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JAZ COMPUTER – Official Website Relocation</title>

  <!-- 1. Canonical Link directing search engines to the new official website -->
  <link rel="canonical" href="https://spmohamed.github.io/jaz-computer-profile/">

  <!-- 2. Search Engine Directives -->
  <meta name="robots" content="index, follow">

  <!-- 3. Primary Hash-Preserving Redirect (Executes when JavaScript is enabled) -->
  <script>
    (function () {
      var targetBase = "https://spmohamed.github.io/jaz-computer-profile/";
      var rawHash = window.location.hash || "";
      var normalizedHash = rawHash.toLowerCase().trim();

      // Supported section anchors on the new official website
      var validHashes = ["#home", "#about", "#products", "#services", "#cctv", "#clients", "#gallery", "#contact"];

      // Preserve valid hash or default to homepage root
      var targetHash = "";
      if (validHashes.indexOf(normalizedHash) !== -1) {
        targetHash = normalizedHash;
      }

      // Perform instant navigation without polluting back-button history
      window.location.replace(targetBase + targetHash);
    })();
  </script>

  <!-- 4. Fallback Redirect (Executes ONLY when JavaScript is disabled) -->
  <noscript>
    <meta http-equiv="refresh" content="0; url=https://spmohamed.github.io/jaz-computer-profile/">
  </noscript>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080f1d;
      color: #f4f7fb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Tamil", sans-serif;
      padding: 24px;
      line-height: 1.6;
    }
    .card {
      max-width: 520px;
      width: 100%;
      padding: 40px 32px;
      background: #111c30;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 99px;
      background: rgba(94, 234, 212, 0.12);
      border: 1px solid rgba(94, 234, 212, 0.35);
      color: #5eead4;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 18px;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      margin: 0 0 12px;
      color: #ffffff;
      letter-spacing: 0.5px;
    }
    p {
      color: #b7c3d5;
      font-size: 15px;
      margin: 0 0 8px;
    }
    p.tamil {
      color: #9cb2cc;
      font-size: 14px;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 32px;
      background: #5eead4;
      color: #081323;
      font-weight: 800;
      font-size: 15px;
      text-decoration: none;
      border-radius: 10px;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }
    .btn:hover {
      background: #4cd4be;
      transform: translateY(-2px);
    }
    .note {
      margin-top: 24px;
      font-size: 12px;
      color: #728299;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Official Notice</span>
    <h1>JAZ COMPUTER</h1>
    <p>Our website has permanently relocated to our new official web platform.</p>
    <p class="tamil">எங்கள் அதிகாரப்பூர்வ இணையதளம் புதிய முகவரிக்கு மாற்றப்பட்டுள்ளது.</p>
    <a class="btn" href="https://spmohamed.github.io/jaz-computer-profile/">Visit Official Website →</a>
